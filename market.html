<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>转售市场 - SuperSkills</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-stone-50 min-h-screen">
<div id="app" class="max-w-4xl mx-auto px-6 py-12">
  <a href="/" class="text-stone-500 mb-8 inline-block">← 返回</a>
  <h1 class="text-2xl font-bold mb-6">转售市场</h1>

  <!-- 挂单列表 -->
  <div class="space-y-4">
    <div v-for="item in listings" :key="item.id" class="bg-white/70 backdrop-blur rounded-xl p-4 flex justify-between items-center">
      <div class="flex items-center gap-4">
        <span class="text-2xl">{{ item.icon }}</span>
        <div>
          <div class="font-semibold">{{ item.name }}</div>
          <div class="text-stone-400 text-sm">卖家: {{ item.seller }}</div>
        </div>
      </div>
      <div class="text-right">
        <div class="text-xl font-bold">¥{{ item.price }}</div>
        <button class="text-indigo-500 text-sm">购买</button>
      </div>
    </div>
  </div>
</div>

<script>
const { createApp } = Vue;
createApp({
  data() {
    return {
      listings: [
        { id: 1, name: 'Agent Reach', icon: '👁️', price: 45, seller: '@dev1' },
        { id: 2, name: 'Soulcraft', icon: '🪞', price: 38, seller: '@dev2' },
      ]
    }
  }
}).mount('#app');
</script>
</body>
</html>
