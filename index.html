<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperSkills - AI技能交易所</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-stone-50 min-h-screen">
<div id="app">
  <div class="max-w-5xl mx-auto px-6 py-12">
    <!-- Header -->
    <header class="text-center mb-16">
      <div class="inline-block bg-gradient-to-r from-indigo-500 to-purple-500 text-white px-4 py-1 rounded-full text-sm mb-4">
        🔥 AI技能交易所
      </div>
      <h1 class="text-4xl font-bold mb-3">SuperSkills</h1>
      <p class="text-stone-500">买卖AI技能，早买早赚</p>
    </header>

    <!-- 技能列表 -->
    <div class="grid md:grid-cols-3 gap-6 mb-16">
      <div v-for="skill in skills" :key="skill.id" 
           class="bg-white/70 backdrop-blur rounded-2xl p-6 shadow-sm hover:shadow-lg hover:-translate-y-1 transition-all cursor-pointer"
           @click="openSkill(skill.id)">
        <div class="text-3xl mb-3">{{ skill.icon }}</div>
        <h3 class="font-semibold text-lg mb-1">{{ skill.name }}</h3>
        <p class="text-stone-500 text-sm mb-4">{{ skill.desc }}</p>
        <div class="flex justify-between items-center">
          <span class="text-2xl font-bold">¥{{ getPrice(skill) }}</span>
          <span class="text-stone-400 text-sm">{{ skill.sold }} 已售</span>
        </div>
      </div>
    </div>

    <!-- 统计数据 -->
    <div class="grid grid-cols-4 gap-4 mb-16 text-center">
      <div class="bg-white/50 rounded-xl p-4">
        <div class="text-2xl font-bold text-indigo-500">3</div>
        <div class="text-stone-500 text-sm">技能上架</div>
      </div>
      <div class="bg-white/50 rounded-xl p-4">
        <div class="text-2xl font-bold text-indigo-500">43</div>
        <div class="text-stone-500 text-sm">总销量</div>
      </div>
      <div class="bg-white/50 rounded-xl p-4">
        <div class="text-2xl font-bold text-indigo-500">¥2.1k</div>
        <div class="text-stone-500 text-sm">交易额</div>
      </div>
      <div class="bg-white/50 rounded-xl p-4">
        <div class="text-2xl font-bold text-indigo-500">12</div>
        <div class="text-stone-500 text-sm">卖家</div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-stone-400 text-sm">
      © 2026 SuperSkills · AI技能交易所
    </footer>
  </div>
</div>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      skills: [
        { id: '1', name: 'Agent Reach', icon: '👁️', desc: '让AI看见整个互联网', base: 29, sold: 12 },
        { id: '2', name: 'Proactive Solvr', icon: '🧠', desc: '主动式AI助手', base: 29, sold: 8 },
        { id: '3', name: 'Soulcraft', icon: '🪞', desc: '为AI创建独特灵魂', base: 19, sold: 23 },
      ]
    }
  },
  methods: {
    getPrice(skill) {
      return Math.round(skill.base * Math.pow(1 + skill.sold / 10, 1.5));
    },
    openSkill(id) {
      window.location.href = `/skill/${id}`;
    }
  }
}).mount('#app');
</script>
</body>
</html>
