<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperSkills - AI Agent 技能商店</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #f8f7f4;
      --card: rgba(255,255,255,0.7);
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #6366f1;
      --glass: rgba(255,255,255,0.4);
      --shadow: 0 8px 32px rgba(0,0,0,0.08);
      --glow: 0 0 40px rgba(99,102,241,0.15);
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image: 
        radial-gradient(ellipse at 20% 20%, rgba(99,102,241,0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(236,72,153,0.05) 0%, transparent 50%);
    }
    
    .container { max-width: 1000px; margin: 0 auto; padding: 60px 24px; }
    
    header { text-align: center; margin-bottom: 80px; }
    header h1 { font-size: 3rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 16px; }
    header p { font-size: 1.25rem; color: var(--muted); }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
    
    .card {
      background: var(--card);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 24px;
      padding: 32px;
      box-shadow: var(--shadow);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow), var(--glow);
    }
    
    .icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      margin-bottom: 20px;
    }
    
    .card h3 { font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; }
    .card p { color: var(--muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px; }
    .price { font-size: 2rem; font-weight: 700; margin-bottom: 20px; }
    .price span { font-size: 1rem; color: var(--muted); font-weight: 400; }
    
    .btn {
      display: block; width: 100%;
      background: var(--text);
      color: white;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s;
    }
    .btn:hover { background: var(--accent); }
    
    footer { text-align: center; margin-top: 80px; color: var(--muted); font-size: 0.875rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>SuperSkills</h1>
      <p>给你的 AI Agent 装上超能力</p>
    </header>

    <div class="grid">
      <div class="card">
        <div class="icon">👁️</div>
        <h3>Agent Reach</h3>
        <p>让 AI 看见整个互联网，搜索、抓取、分析一气呵成</p>
        <div class="price">¥99 <span>/ 永久</span></div>
        <a href="#" class="btn">立即购买</a>
      </div>

      <div class="card">
        <div class="icon">🧠</div>
        <h3>Proactive Solvr</h3>
        <p>主动式 AI 助手，不等你问就帮你解决问题</p>
        <div class="price">¥49 <span>/ 永久</span></div>
        <a href="#" class="btn">立即购买</a>
      </div>

      <div class="card">
        <div class="icon">🪞</div>
        <h3>Soulcraft</h3>
        <p>为你的 AI 创建独特灵魂，个性化到骨子里</p>
        <div class="price">¥29 <span>/ 永久</span></div>
        <a href="#" class="btn">立即购买</a>
      </div>
    </div>

    <footer>© 2026 SuperSkills</footer>
  </div>
</body>
</html>
