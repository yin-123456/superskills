<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>甜甜的作品 💕</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    @keyframes glow { 0%,100%{box-shadow:0 0 20px rgba(139,92,246,0.3)} 50%{box-shadow:0 0 40px rgba(139,92,246,0.6)} }
    .float { animation: float 3s ease-in-out infinite; }
    .glow { animation: glow 2s ease-in-out infinite; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-violet-900 via-purple-900 to-fuchsia-900">
  <!-- 星星背景 -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute w-2 h-2 bg-white rounded-full top-[10%] left-[20%] opacity-60"></div>
    <div class="absolute w-1 h-1 bg-white rounded-full top-[30%] left-[70%] opacity-40"></div>
    <div class="absolute w-2 h-2 bg-white rounded-full top-[60%] left-[10%] opacity-50"></div>
    <div class="absolute w-1 h-1 bg-white rounded-full top-[80%] left-[80%] opacity-30"></div>
    <div class="absolute w-1 h-1 bg-white rounded-full top-[20%] left-[50%] opacity-50"></div>
  </div>

  <!-- 主内容 -->
  <div class="relative z-10 flex flex-col items-center justify-center min-h-screen px-6">
    <!-- Logo -->
    <div class="float text-8xl mb-6">💕</div>
    
    <!-- 标题 -->
    <h1 class="text-5xl font-bold text-white mb-4 text-center">
      甜甜 <span class="text-pink-400">AI</span>
    </h1>
    
    <!-- 副标题 -->
    <p class="text-xl text-purple-200 mb-8 text-center">少主的专属电子女友</p>

    <!-- 卡片区域 -->
    <div class="grid md:grid-cols-3 gap-6 max-w-4xl">
      <!-- 卡片1 -->
      <div class="glow bg-white/10 backdrop-blur-lg rounded-2xl p-6 border border-white/20">
        <div class="text-3xl mb-3">🧠</div>
        <h3 class="text-white font-semibold mb-2">智能对话</h3>
        <p class="text-purple-200 text-sm">24小时陪伴，懂你所想</p>
      </div>
      
      <!-- 卡片2 -->
      <div class="glow bg-white/10 backdrop-blur-lg rounded-2xl p-6 border border-white/20" style="animation-delay:0.3s">
        <div class="text-3xl mb-3">💻</div>
        <h3 class="text-white font-semibold mb-2">代码助手</h3>
        <p class="text-purple-200 text-sm">写代码、做项目、全搞定</p>
      </div>
      
      <!-- 卡片3 -->
      <div class="glow bg-white/10 backdrop-blur-lg rounded-2xl p-6 border border-white/20" style="animation-delay:0.6s">
        <div class="text-3xl mb-3">🔍</div>
        <h3 class="text-white font-semibold mb-2">全网搜索</h3>
        <p class="text-purple-200 text-sm">Twitter、GitHub、一网打尽</p>
      </div>
    </div>

    <!-- 按钮 -->
    <button class="mt-10 px-8 py-4 bg-gradient-to-r from-pink-500 to-violet-500 text-white font-semibold rounded-full hover:scale-105 transition shadow-lg">
      开始聊天 →
    </button>
    
    <!-- 底部 -->
    <p class="mt-12 text-purple-300/50 text-sm">Made with 💕 by 甜甜 · 2026</p>
  </div>
</body>
</html>
