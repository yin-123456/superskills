<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上架技能 - SuperSkills</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-stone-50 min-h-screen">
<div id="app" class="max-w-xl mx-auto px-6 py-12">
  <a href="/" class="text-stone-500 mb-8 inline-block">← 返回</a>
  <h1 class="text-2xl font-bold mb-6">上架技能</h1>

  <div class="bg-white/70 backdrop-blur rounded-2xl p-6">
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">技能名称</label>
        <input v-model="form.name" class="w-full px-4 py-2 rounded-lg border" placeholder="如：Agent Reach">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">图标 Emoji</label>
        <input v-model="form.icon" class="w-full px-4 py-2 rounded-lg border" placeholder="如：👁️">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">描述</label>
        <textarea v-model="form.desc" class="w-full px-4 py-2 rounded-lg border" rows="3"></textarea>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">起始价格</label>
        <input v-model="form.price" type="number" class="w-full px-4 py-2 rounded-lg border" placeholder="29">
      </div>
      <button @click="submit" class="w-full bg-indigo-500 text-white py-3 rounded-xl font-semibold">
        提交上架
      </button>
    </div>
  </div>
</div>

<script>
const { createApp } = Vue;
createApp({
  data() {
    return { form: { name: '', icon: '', desc: '', price: 29 } }
  },
  methods: {
    submit() { alert('上架成功！'); }
  }
}).mount('#app');
</script>
</body>
</html>
